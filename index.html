<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Lists</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: dark;
      --background: #050607;
      --panel: #0b0d10;
      --border: #24282d;
      --text: #f2f4f6;
      --muted: #929aa3;
      --red: #ff2638;
      --green: #22e784;
      --yellow: #ffd43b;
    }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      background: var(--background);
      color: var(--text);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible {
      outline: 2px solid var(--text); outline-offset: -3px;
    }
    [hidden] { display: none !important; }

    /* Full screen: two equal columns above, one full-width section below. */
    .workspace {
      width: 100%; height: 100vh; height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 62fr) minmax(0, 38fr);
      border: 1px solid var(--red);
    }
    .panel {
      min-width: 0; min-height: 0;
      display: flex; flex-direction: column;
      padding: clamp(24px, 5vh, 60px) clamp(14px, 4vw, 70px) 22px;
    }
    .left-panel { border-right: 1px solid var(--red); }
    .shared-panel {
      grid-column: 1 / -1;
      border-top: 1px solid var(--red);
      padding-top: clamp(16px, 2.6vh, 30px);
      padding-bottom: 48px;
    }
    .title {
      width: 100%; min-width: 0; flex-shrink: 0;
      padding: 7px 4px; margin-bottom: clamp(12px, 2.6vh, 30px);
      border: 0; border-bottom: 1px solid transparent;
      border-radius: 0; outline: none;
      background: transparent; color: var(--text);
      font-size: clamp(22px, 3vw, 44px);
      font-weight: 700; letter-spacing: 1px;
      text-align: center; text-transform: uppercase;
    }
    .title:focus { border-bottom-color: var(--red); }
    .shared-title { font-size: clamp(18px, 2vw, 28px); margin-bottom: 14px; }
    .add-form {
      display: flex; flex-shrink: 0;
      width: 100%; height: 46px; margin-bottom: 16px;
      background: var(--panel); border: 1px solid var(--border);
    }
    .add-form:focus-within { border-color: var(--red); }
    .add-form input {
      min-width: 0; width: 100%; padding: 0 14px;
      background: transparent; border: 0; outline: none;
      color: var(--text); font-size: 13px;
    }
    .add-form input::placeholder { color: var(--muted); }
    .add-form button {
      flex: 0 0 46px; border: 0; border-left: 1px solid var(--border);
      background: transparent; color: var(--red); font-size: 23px;
    }
    .add-form button:hover { background: var(--red); color: white; }
    .items {
      flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
      list-style: none; scrollbar-width: thin; scrollbar-color: #64212a transparent;
      overscroll-behavior: contain;
    }
    .shared-panel .add-form, .shared-panel .items {
      width: min(100%, 900px); margin-left: auto; margin-right: auto;
    }
    .entry {
      --status: var(--muted);
      min-height: 50px; margin-bottom: 7px;
      display: grid; grid-template-columns: minmax(0, 1fr) 30px 30px;
      align-items: stretch;
      border: 1px solid var(--border); background: var(--panel);
    }
    .entry:hover { background: #111519; }
    .entry[data-status="green"] { --status: var(--green); border-color: #1e6142; }
    .entry[data-status="yellow"] { --status: var(--yellow); border-color: #6b5924; }
    .entry[data-status="red"] { --status: var(--red); border-color: #702731; }
    .entry-toggle {
      min-width: 0; display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 9px;
      align-items: center; gap: 10px; padding: 10px 12px 10px 4px;
      text-align: left; border: 0; background: transparent; color: var(--status);
    }
    .entry-number { color: #747d85; font-size: 10px; text-align: center; }
    .entry-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .entry-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--status); }
    .entry:not([data-status="neutral"]) .entry-dot { box-shadow: 0 0 9px var(--status); }
    .entry-action { border: 0; background: transparent; color: #919aa3; font-size: 17px; }
    .entry-action:hover { color: white; }
    .entry-action.remove:hover { color: var(--red); }
    .empty { padding: 24px 8px; text-align: center; color: var(--muted); font-size: 12px; }

    /* Compact controls preserve multiple saved lists without adding a header. */
    .menu-toggle {
      position: fixed; right: 12px; bottom: 10px; z-index: 3;
      padding: 8px 12px; background: #090b0d;
      border: 1px solid #65242c; color: var(--red); font-size: 10px; letter-spacing: 2px;
    }
    .board-menu {
      position: fixed; right: 12px; bottom: 50px; z-index: 4;
      width: min(290px, calc(100vw - 24px)); padding: 14px;
      background: #0b0d10; border: 1px solid var(--red);
      box-shadow: 0 12px 50px #000;
    }
    .board-menu label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 10px; }
    .board-menu select {
      width: 100%; height: 38px; padding: 0 8px;
      background: #08090b; border: 1px solid var(--border); color: var(--text);
    }
    .board-actions { display: flex; gap: 6px; margin-top: 10px; }
    .board-actions button {
      flex: 1; padding: 10px 4px; background: transparent;
      color: var(--text); border: 1px solid var(--border); font-size: 10px;
    }
    .board-actions button:hover { border-color: var(--red); }
    #deleteBoard { color: var(--red); }
    .warning {
      position: fixed; left: 10px; bottom: 10px; z-index: 5;
      max-width: calc(100vw - 110px); padding: 10px;
      border: 1px solid var(--yellow); color: var(--yellow);
      background: #090b0d; font-size: 11px;
    }

    /* Keep the two-column split even on phones. */
    @media (max-width: 600px) {
      .panel { padding: 24px 10px 14px; }
      .shared-panel { padding: 16px 12px 48px; }
      .title { font-size: 20px; letter-spacing: 0; margin-bottom: 14px; }
      .shared-title { font-size: 18px; }
      .add-form { height: 40px; margin-bottom: 10px; }
      .add-form input { padding: 0 8px; font-size: 11px; }
      .add-form button { flex-basis: 32px; }
      .entry { grid-template-columns: minmax(0, 1fr) 23px 23px; min-height: 46px; }
      .entry-toggle { grid-template-columns: minmax(0, 1fr) 6px; gap: 6px; padding: 8px; }
      .entry-number { display: none; }
      .entry-name { font-size: 12px; }
      .entry-dot { width: 6px; height: 6px; }
    }
    @media (max-height: 600px) {
      .panel { padding-top: 10px; padding-bottom: 8px; }
      .shared-panel { padding-bottom: 40px; }
      .title { font-size: 20px; padding: 3px; margin-bottom: 6px; }
      .shared-title { font-size: 16px; }
      .add-form { height: 32px; margin-bottom: 6px; }
      .entry { min-height: 36px; margin-bottom: 4px; }
      .entry-toggle { padding-top: 5px; padding-bottom: 5px; }
      .empty { padding: 8px; }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <section class="panel left-panel" aria-label="Left list">
      <input id="leftTitle" class="title" value="PERSON A" aria-label="Left title" spellcheck="false">
      <form class="add-form" data-side="left">
        <input id="leftInput" placeholder="Add item..." aria-label="Add item to left list" autocomplete="off" required>
        <button type="submit" aria-label="Add to left list">+</button>
      </form>
      <ul id="leftItems" class="items" aria-label="Left items"></ul>
    </section>

    <section class="panel" aria-label="Right list">
      <input id="rightTitle" class="title" value="PERSON B" aria-label="Right title" spellcheck="false">
      <form class="add-form" data-side="right">
        <input id="rightInput" placeholder="Add item..." aria-label="Add item to right list" autocomplete="off" required>
        <button type="submit" aria-label="Add to right list">+</button>
      </form>
      <ul id="rightItems" class="items" aria-label="Right items"></ul>
    </section>

    <section class="panel shared-panel" aria-label="Shared list">
      <input id="sharedTitle" class="title shared-title" value="MUTUAL / SHARED" aria-label="Shared title" spellcheck="false">
      <form class="add-form" data-side="shared">
        <input id="sharedInput" placeholder="Add an item to both sides..." aria-label="Add an item to both sides" autocomplete="off" required>
        <button type="submit" aria-label="Add to both sides">+</button>
      </form>
      <ul id="sharedItems" class="items" aria-label="Items appearing on both sides"></ul>
    </section>
  </main>

  <button id="menuToggle" class="menu-toggle" type="button" aria-controls="boardMenu" aria-expanded="false">LISTS</button>
  <aside id="boardMenu" class="board-menu" aria-label="Saved lists" hidden>
    <label for="boardSelect">SAVED LISTS</label>
    <select id="boardSelect"></select>
    <div class="board-actions">
      <button id="newBoard" type="button">+ NEW</button>
      <button id="renameBoard" type="button">RENAME</button>
      <button id="deleteBoard" type="button">DELETE</button>
    </div>
  </aside>
  <p id="warning" class="warning" role="status" hidden>Browser storage is unavailable. Changes will not survive a reload.</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    (() => {
      "use strict";
      const $ = id => document.getElementById(id);

      /*
        FIREBASE SETUP
        Replace ONLY the values below with the config Firebase gives you at:
        Project settings -> Your apps -> Web app -> SDK setup and configuration.
      */
      const firebaseConfig = {
        apiKey: "AIzaSyBgfLRiBlkr3ydKRj9RSGSg3_0nhqBzLNw",
        authDomain: "list-21ec8.firebaseapp.com",
        projectId: "list-21ec8",
        storageBucket: "list-21ec8.firebasestorage.app",
        messagingSenderId: "201946783103",
        appId: "1:201946783103:web:90151170641ec02adc0e4a"
      };

      const STORAGE_KEY = "listWorkspace_v3";
      const CACHE_PREFIX = "listWorkspace_room_";
      const COLORS = ["neutral", "green", "yellow", "red"];
      const SIDES = ["left", "right"];
      const uid = () => globalThis.crypto?.randomUUID?.()
        || Date.now().toString(36) + Math.random().toString(36).slice(2);
      const keyOf = name => name.trim().toLowerCase();
      const nextColor = color => COLORS[(COLORS.indexOf(color) + 1) % COLORS.length];
      const colorName = color => color === "neutral" ? "gray" : color;
      const newItem = (name, status = "neutral") => ({ id: uid(), name, status });

      function newList(name, example = false) {
        return {
          id: uid(), name, sharedTitle: "MUTUAL / SHARED",
          left: { name: "PERSON A", entries: example ? ["Item 1", "Item 2", "Item 3"].map(n => newItem(n)) : [] },
          right: { name: "PERSON B", entries: example ? ["Item A", "Item B", "Item C"].map(n => newItem(n)) : [] }
        };
      }

      // Import either previous version without deleting its saved data.
      function normalizeBoard(raw) {
        const board = newList(typeof raw.name === "string" ? raw.name : "LIST");
        board.id = typeof raw.id === "string" && raw.id ? raw.id : board.id;
        board.sharedTitle = typeof raw.sharedTitle === "string" ? raw.sharedTitle : board.sharedTitle;
        for (const side of SIDES) {
          const source = raw[side];
          if (typeof source?.name === "string") board[side].name = source.name;
          const entries = Array.isArray(source?.entries) ? source.entries
            : Array.isArray(source?.friends) ? source.friends : [];
          const ids = new Set();
          board[side].entries = entries.filter(e => e && typeof e.name === "string").map(e => {
            let id = typeof e.id === "string" && e.id ? e.id : uid();
            if (ids.has(id)) id = uid();
            ids.add(id);
            return { id, name: e.name, status: COLORS.includes(e.status) ? e.status : "neutral" };
          });
        }
        return board;
      }

      function normalizeState(data) {
        if (!Array.isArray(data?.boards)) return null;
        const boards = data.boards
          .filter(b => b && typeof b === "object" && !Array.isArray(b))
          .map(normalizeBoard);
        if (!boards.length) return null;

        const ids = new Set();
        boards.forEach(b => {
          if (ids.has(b.id)) b.id = uid();
          ids.add(b.id);
        });

        return {
          boards,
          activeBoardId: boards.some(b => b.id === data.activeBoardId)
            ? data.activeBoardId
            : boards[0].id
        };
      }

      function roomFromUrl() {
        const params = new URLSearchParams(location.search);
        let roomId = params.get("room");

        if (!roomId || !/^[A-Za-z0-9_-]{20,80}$/.test(roomId)) {
          roomId = uid().replace(/-/g, "");
          params.set("room", roomId);
          const query = params.toString();
          history.replaceState(null, "", `${location.pathname}?${query}${location.hash}`);
        }

        return roomId;
      }

      const roomId = roomFromUrl();
      const roomCacheKey = CACHE_PREFIX + roomId;

      function loadLocal() {
        /*
          First try a cache for THIS shared URL. If this is a brand-new room,
          import your old local list so your existing data is not lost.
        */
        for (const key of [roomCacheKey, STORAGE_KEY, "genericListBoards_v2", "friendListBoards_v1"]) {
          try {
            const parsed = JSON.parse(localStorage.getItem(key));
            const normalized = normalizeState(parsed);
            if (normalized) return normalized;
          } catch (error) {
            console.warn("Could not read saved lists:", error);
          }
        }

        const board = newList("LIST 01", true);
        return { boards: [board], activeBoardId: board.id };
      }

      let state = loadLocal();
      const active = () => state.boards.find(b => b.id === state.activeBoardId);

      let roomRef = null;
      let remoteReady = false;
      let remoteTimer = null;
      let lastLocalJson = JSON.stringify(state);

      function showConnectionError(error) {
        $("warning").textContent = "Shared sync is unavailable. Check Firebase setup / connection.";
        $("warning").hidden = false;
        console.error(error);
      }

      function queueRemoteSave() {
        if (!remoteReady || !roomRef) return;

        clearTimeout(remoteTimer);
        remoteTimer = setTimeout(async () => {
          try {
            const snapshot = JSON.parse(JSON.stringify(state));
            lastLocalJson = JSON.stringify(snapshot);
            await setDoc(roomRef, {
              state: snapshot,
              updatedAt: serverTimestamp()
            });
            $("warning").hidden = true;
          } catch (error) {
            showConnectionError(error);
          }
        }, 180);
      }

      function save() {
        try {
          localStorage.setItem(roomCacheKey, JSON.stringify(state));
          lastLocalJson = JSON.stringify(state);
        } catch (error) {
          console.warn("Could not cache lists locally:", error);
        }

        queueRemoteSave();
      }

      function update() {
        save();
        render();
      }

      async function connectSharedRoom() {
        const configMissing = Object.values(firebaseConfig).some(value =>
          !value || String(value).includes("PASTE_YOUR_")
        );

        if (configMissing) {
          $("warning").textContent = "Firebase is not configured yet. Paste your Firebase config into this HTML file.";
          $("warning").hidden = false;
          return;
        }

        try {
          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);
          await signInAnonymously(auth);

          const db = getFirestore(app);
          roomRef = doc(db, "rooms", roomId);

          const first = await getDoc(roomRef);

          if (first.exists()) {
            const remote = normalizeState(first.data()?.state);
            if (remote) {
              state = remote;
              lastLocalJson = JSON.stringify(state);
              try { localStorage.setItem(roomCacheKey, lastLocalJson); } catch {}
              render();
            }
          } else {
            /* First person to open this room uploads their current local list. */
            await setDoc(roomRef, {
              state: JSON.parse(JSON.stringify(state)),
              updatedAt: serverTimestamp()
            });
          }

          remoteReady = true;
          $("warning").hidden = true;

          onSnapshot(roomRef, snapshot => {
            if (!snapshot.exists()) return;
            const remote = normalizeState(snapshot.data()?.state);
            if (!remote) return;

            const remoteJson = JSON.stringify(remote);
            if (remoteJson === lastLocalJson) return;

            state = remote;
            lastLocalJson = remoteJson;
            try { localStorage.setItem(roomCacheKey, remoteJson); } catch {}
            render();
          }, showConnectionError);
        } catch (error) {
          showConnectionError(error);
        }
      }

      // Match names ignoring capitalization and surrounding spaces.
      // A shared group includes every matching item, including old duplicates.
      function sharedGroups() {
        const maps = SIDES.map(side => {
          const map = new Map();
          active()[side].entries.forEach(item => {
            const key = keyOf(item.name);
            if (!map.has(key)) map.set(key, []);
            map.get(key).push(item);
          });
          return map;
        });
        const groups = [];
        for (const [key, left] of maps[0]) {
          if (!key || !maps[1].has(key)) continue;
          const entries = [...left, ...maps[1].get(key)];
          const mixed = entries.some(e => e.status !== entries[0].status);
          groups.push({ id: key, name: left[0].name, entries, mixed, status: mixed ? "neutral" : entries[0].status });
        }
        return groups;
      }

      function makeRow(item, index, side, entries) {
        const row = document.createElement("li");
        row.className = "entry";
        row.dataset.status = item.status;
        const toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "entry-toggle";
        toggle.dataset.focus = side + ":" + item.id;
        const description = item.mixed ? "different colors on the two sides" : colorName(item.status);
        toggle.title = `${item.name}: ${description}. Click for ${colorName(nextColor(item.status))}${side === "shared" ? " on both sides" : ""}.`;
        toggle.setAttribute("aria-label", toggle.title);
        for (const [className, text] of [
          ["entry-number", String(index + 1).padStart(2, "0")],
          ["entry-name", item.name], ["entry-dot", ""]
        ]) {
          const span = document.createElement("span");
          span.className = className;
          span.textContent = text;
          if (className !== "entry-name") span.setAttribute("aria-hidden", "true");
          toggle.append(span);
        }
        toggle.addEventListener("click", () => {
          entries.forEach(entry => { entry.status = nextColor(item.status); });
          update();
        });
        row.append(toggle);
        for (const [text, label, action] of [["✎", "Rename", "rename"], ["×", "Delete", "remove"]]) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "entry-action " + action;
          button.textContent = text;
          button.title = `${label} ${item.name}${side === "shared" ? " on both sides" : ""}`;
          button.setAttribute("aria-label", button.title);
          button.addEventListener("click", () => editItems(action, side, item, entries));
          row.append(button);
        }
        return row;
      }

      function editItems(action, side, item, entries) {
        const affected = side === "shared" ? SIDES : [side];
        if (action === "rename") {
          const name = prompt(side === "shared" ? "Rename on both sides:" : "Rename item:", item.name)?.trim();
          if (!name) return;
          const duplicate = affected.some(s => active()[s].entries.some(e => !entries.includes(e) && keyOf(e.name) === keyOf(name)));
          if (duplicate) return alert("That name is already in the list.");
          entries.forEach(e => { e.name = name; });
        } else {
          if (side === "shared" && !confirm(`Delete "${item.name}" from BOTH sides?`)) return;
          affected.forEach(s => { active()[s].entries = active()[s].entries.filter(e => !entries.includes(e)); });
        }
        update();
      }

      function render() {
        const board = active();
        const focusKey = document.activeElement?.dataset.focus;
        $("boardSelect").replaceChildren(...state.boards.map(b => {
          const option = document.createElement("option");
          option.value = b.id; option.textContent = b.name;
          option.selected = b.id === state.activeBoardId;
          return option;
        }));
        for (const side of [...SIDES, "shared"]) {
          $(side + "Title").value = side === "shared" ? board.sharedTitle : board[side].name;
          const list = $(side + "Items");
          const scrollTop = list.scrollTop;
          const items = side === "shared" ? sharedGroups() : board[side].entries;
          list.replaceChildren(...items.map((item, index) => makeRow(item, index, side, side === "shared" ? item.entries : [item])));
          if (!items.length) {
            const empty = document.createElement("li");
            empty.className = "empty";
            empty.textContent = side === "shared" ? "Items appearing on both sides" : "No items yet";
            list.append(empty);
          }
          list.scrollTop = scrollTop;
        }
        if (focusKey) {
          [...document.querySelectorAll("[data-focus]")].find(e => e.dataset.focus === focusKey)?.focus({ preventScroll: true });
        }
      }

      document.querySelectorAll(".add-form").forEach(form => {
        form.addEventListener("submit", event => {
          event.preventDefault();
          const side = form.dataset.side;
          const input = $(side + "Input");
          const name = input.value.trim();
          if (!name) return;
          const board = active();
          if (side === "shared") {
            const existing = SIDES.map(s => board[s].entries.find(e => keyOf(e.name) === keyOf(name)));
            const status = existing.find(Boolean)?.status || "neutral";
            SIDES.forEach((s, i) => { if (!existing[i]) board[s].entries.push(newItem(name, status)); });
          } else {
            if (board[side].entries.some(e => keyOf(e.name) === keyOf(name))) return alert("That item is already in this list.");
            board[side].entries.push(newItem(name));
          }
          input.value = "";
          update();
          input.focus();
        });
      });

      for (const side of [...SIDES, "shared"]) {
        $(side + "Title").addEventListener("input", event => {
          if (side === "shared") active().sharedTitle = event.target.value;
          else active()[side].name = event.target.value;
          save();
        });
      }

      function showMenu(open) {
        $("boardMenu").hidden = !open;
        $("menuToggle").setAttribute("aria-expanded", String(open));
      }
      $("menuToggle").addEventListener("click", () => showMenu($("boardMenu").hidden));
      document.addEventListener("click", event => {
        if (!$("boardMenu").contains(event.target) && !$("menuToggle").contains(event.target)) showMenu(false);
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && !$("boardMenu").hidden) { showMenu(false); $("menuToggle").focus(); }
      });
      $("boardSelect").addEventListener("change", event => {
        state.activeBoardId = event.target.value;
        document.querySelectorAll(".add-form input").forEach(input => { input.value = ""; });
        update(); showMenu(false);
      });
      $("newBoard").addEventListener("click", () => {
        const name = prompt("Name this set of lists:", `LIST ${state.boards.length + 1}`)?.trim();
        if (!name) return;
        const board = newList(name);
        state.boards.push(board); state.activeBoardId = board.id;
        document.querySelectorAll(".add-form input").forEach(input => { input.value = ""; });
        update(); showMenu(false);
      });
      $("renameBoard").addEventListener("click", () => {
        const name = prompt("Rename this set of lists:", active().name)?.trim();
        if (name) { active().name = name; update(); }
      });
      $("deleteBoard").addEventListener("click", () => {
        if (state.boards.length === 1) return alert("Keep at least one set of lists.");
        if (!confirm(`Delete "${active().name}" and all of its items?`)) return;
        state.boards = state.boards.filter(b => b.id !== state.activeBoardId);
        state.activeBoardId = state.boards[0].id;
        update();
      });

      render();
      save();
      connectSharedRoom();
    })();
  </script>
</body>
</html>
