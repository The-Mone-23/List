<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lists</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- SMALL FLOATING LIST MANAGER -->
    <button
        id="boardMenuToggle"
        class="board-menu-toggle"
        type="button"
    >
        LISTS
    </button>

    <div
        id="boardMenu"
        class="board-menu"
    >

        <select id="boardSelect"></select>

        <div class="board-actions">

            <button
                id="newBoardButton"
                type="button"
            >
                + NEW
            </button>

            <button
                id="renameBoardButton"
                type="button"
            >
                RENAME
            </button>

            <button
                id="deleteBoardButton"
                class="danger"
                type="button"
            >
                DELETE
            </button>

        </div>

    </div>


    <main class="workspace">

        <!-- TOP TWO LISTS -->
        <div class="top-lists">

            <!-- LEFT -->
            <section class="panel">

                <input
                    id="leftPersonName"
                    class="title-input"
                    type="text"
                    value="PERSON A"
                    spellcheck="false"
                >

                <div class="add-entry">

                    <input
                        id="leftEntryInput"
                        type="text"
                        placeholder="Add entry..."
                        autocomplete="off"
                    >

                    <button
                        id="leftAddButton"
                        type="button"
                    >
                        +
                    </button>

                </div>

                <div
                    id="leftEntryList"
                    class="entry-list"
                ></div>

            </section>


            <!-- RED DIVIDER -->
            <div class="vertical-divider"></div>


            <!-- RIGHT -->
            <section class="panel">

                <input
                    id="rightPersonName"
                    class="title-input"
                    type="text"
                    value="PERSON B"
                    spellcheck="false"
                >

                <div class="add-entry">

                    <input
                        id="rightEntryInput"
                        type="text"
                        placeholder="Add entry..."
                        autocomplete="off"
                    >

                    <button
                        id="rightAddButton"
                        type="button"
                    >
                        +
                    </button>

                </div>

                <div
                    id="rightEntryList"
                    class="entry-list"
                ></div>

            </section>

        </div>


        <!-- SHARED / MUTUAL -->
        <section class="shared-section">

            <div class="shared-header">

                <h2>SHARED</h2>

                <span>
                    PRESENT ON BOTH SIDES
                </span>

            </div>


            <div class="shared-add">

                <input
                    id="sharedEntryInput"
                    type="text"
                    placeholder="Add to both sides..."
                    autocomplete="off"
                >

                <button
                    id="sharedAddButton"
                    type="button"
                >
                    +
                </button>

            </div>


            <div
                id="sharedEntryList"
                class="shared-list"
            ></div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
